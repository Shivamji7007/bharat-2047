<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>BHARAT 2047: Real Virtual Map & Premier Institutions</title>
  <!-- Leaflet Real Interactive Map CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background: #050a15; color: #eef4ff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    /* Top HUD */
    .hud {
      display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap;
      padding: 8px 16px; background: #091326; border-bottom: 1px solid #1e3a6e; z-index: 1000; gap: 8px;
    }
    .brand { font-weight: 800; font-size: 1.05rem; background: linear-gradient(90deg, #ff9933, #fff, #38ef7d); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .metrics { display: flex; gap: 16px; flex-wrap: wrap; }
    .metric { font-size: 0.72rem; color: #8ca0c4; text-transform: uppercase; }
    .metric b { display: block; font-size: 0.96rem; color: #00e5ff; }
    .metric.gdp b { color: #38ef7d; }
    .metric.rank b { color: #ffd700; }

    /* State & Global Bar */
    .nav-bar {
      display: flex; gap: 6px; padding: 7px 12px; background: #070e1d;
      border-bottom: 1px solid #162b52; overflow-x: auto; z-index: 1000; align-items: center;
    }
    .nav-label { font-size: 0.72rem; color: #ff9933; font-weight: 700; white-space: nowrap; margin-right: 4px; }
    .pill {
      padding: 5px 11px; border-radius: 99px; border: 1px solid #24447c;
      background: #0d1b38; color: #cbd5e1; font-size: 0.76rem; font-weight: 600;
      cursor: pointer; white-space: nowrap; transition: 0.15s;
    }
    .pill:hover, .pill.active { background: #ff9933; color: #050b16; border-color: #ff9933; }
    .pill.global { border-color: #00e5ff; color: #00e5ff; }
    .pill.global:hover { background: #00e5ff; color: #050b16; }

    /* Map Container */
    .workspace { position: relative; flex: 1; display: flex; overflow: hidden; }
    #map { flex: 1; height: 100%; background: #050a15; z-index: 1; }

    /* Dark Tactical Map Filter */
    .leaflet-tile-pane { filter: invert(100%) hue-rotate(195deg) brightness(88%) contrast(115%) saturate(130%); }
    .leaflet-control-attribution { display: none; }

    /* Custom Glowing Marker */
    .inst-pin {
      width: 22px; height: 22px; border-radius: 50%;
      border: 2.5px solid #fff; box-shadow: 0 0 14px currentColor;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: bold; color: #fff; cursor: pointer;
      transition: transform 0.2s;
    }
    .inst-pin:hover { transform: scale(1.3); }

    /* Right Drawer: Institute / Global Inspector */
    .drawer {
      position: absolute; top: 12px; right: 12px; width: 340px; max-width: 92vw;
      max-height: calc(100% - 24px); overflow-y: auto;
      background: rgba(8, 16, 33, 0.96); border: 1px solid #284b8a; border-radius: 16px;
      padding: 16px; box-shadow: 0 12px 36px rgba(0,0,0,0.85); z-index: 1000;
    }
    .drawer-badge {
      display: inline-block; padding: 3px 9px; border-radius: 6px;
      font-size: 0.7rem; font-weight: 700; text-transform: uppercase; margin-bottom: 6px;
    }
    .drawer h2 { font-size: 1.08rem; color: #fff; line-height: 1.3; }
    .drawer .loc { font-size: 0.78rem; color: #00e5ff; margin-top: 2px; margin-bottom: 10px; }
    .drawer p { font-size: 0.82rem; color: #cbd5e1; line-height: 1.48; margin-bottom: 10px; }
    .fact-box {
      background: rgba(0, 229, 255, 0.07); border-left: 3px solid #00e5ff;
      padding: 9px; border-radius: 6px; font-size: 0.78rem; color: #e2e8f0; margin-bottom: 12px;
    }
    .fact-box b { color: #00e5ff; display: block; margin-bottom: 2px; }

    .stats-row {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px;
    }
    .mini-stat {
      background: #0e1d3b; padding: 8px; border-radius: 8px; border: 1px solid #1d3768;
    }
    .mini-stat span { font-size: 0.68rem; color: #8ca0c4; display: block; }
    .mini-stat b { font-size: 0.9rem; color: #38ef7d; }

    .action-btn {
      width: 100%; padding: 11px; border-radius: 10px; border: none;
      background: linear-gradient(90deg, #ff9933, #ffb347); color: #050b16;
      font-weight: 800; font-size: 0.86rem; cursor: pointer; transition: 0.15s;
    }
    .action-btn:hover { filter: brightness(1.1); }
    .action-btn:disabled { opacity: 0.45; cursor: not-allowed; }

    .mine-btn {
      width: 100%; padding: 9px; margin-top: 8px; border-radius: 10px;
      border: 1px solid #00e5ff; background: rgba(0,229,255,0.1); color: #00e5ff;
      font-weight: 700; font-size: 0.8rem; cursor: pointer;
    }
    .mine-btn:hover { background: #00e5ff; color: #050b16; }

    .global-card {
      background: #0d1a34; border: 1px solid #1e3b70; border-radius: 10px;
      padding: 10px; margin-bottom: 9px;
    }
    .global-card h4 { font-size: 0.86rem; color: #ff9933; margin-bottom: 4px; }
    .global-card p { font-size: 0.76rem; margin-bottom: 6px; }
    .scan-btn {
      padding: 5px 10px; border-radius: 6px; border: 1px solid #38ef7d;
      background: rgba(56,239,125,0.12); color: #38ef7d; font-size: 0.74rem; font-weight: 700; cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="hud">
    <div class="brand">🇮🇳 BHARAT 2047 // VIRTUAL INDIA & INSTITUTIONS</div>
    <div class="metrics">
      <div class="metric">R&D Budget<b id="funds">₹400 Cr</b></div>
      <div class="metric gdp">India GDP<b id="gdp">$4.30 T</b></div>
      <div class="metric rank">Global Rank<b id="rank">#4 (Target: #1 > $29.2T)</b></div>
      <div class="metric">Global Intel<b id="intel">0 🧠</b></div>
    </div>
  </div>

  <div class="nav-bar" id="stateBar"></div>

  <div class="workspace">
    <div id="map"></div>
    <div class="drawer" id="drawer"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // Real Indian States & Premier Institutions Database
    const institutions = [
      {
        id: 'isro_sdsc', state: 'Andhra Pradesh',
        name: 'ISRO — Satish Dhawan Space Centre (SDSC)',
        city: 'Sriharikota, Andhra Pradesh',
        lat: 13.7200, lng: 80.2266, color: '#f43f5e', sector: 'Space & Launch Vehicles',
        desc: 'India’s primary orbital launchport where LVM3, PSLV, Chandrayaan, Aditya-L1, and Gaganyaan missions lift off.',
        realWork: 'Developing Next-Gen Reusable Launch Vehicle (NGLV) & Bharatiya Antariksh Station modules.',
        level: 1, cost: 200, income: 60, gdp: 0.45
      },
      {
        id: 'iisc', state: 'Karnataka',
        name: 'Indian Institute of Science (IISc) & HAL',
        city: 'Bengaluru, Karnataka',
        lat: 13.0219, lng: 77.5671, color: '#a855f7', sector: 'Deep-Tech, AI & Aerospace',
        desc: 'India’s #1 ranked research university pioneering quantum computing, hypersonic wind tunnels, brain research, and indigenous fighter jet avionics.',
        realWork: 'Param Pravega Supercomputer, Quantum Technology Initiative, and Tejas Mk2 / AMCA aerospace R&D.',
        level: 1, cost: 250, income: 75, gdp: 0.55
      },
      {
        id: 'iitm', state: 'Tamil Nadu',
        name: 'IIT Madras & Research Park',
        city: 'Chennai, Tamil Nadu',
        lat: 12.9915, lng: 80.2337, color: '#00e5ff', sector: 'Semiconductors, Hyperloop & EV',
        desc: 'India’s top engineering institute & deep-tech startup incubator building indigenous RISC-V chips and space startups like Agnikul.',
        realWork: 'SHAKTI Indigenous Microprocessor, 5G/6G Testbed, and Avishkar Hyperloop.',
        level: 0, cost: 320, income: 100, gdp: 0.70
      },
      {
        id: 'barc', state: 'Maharashtra',
        name: 'BARC & IIT Bombay',
        city: 'Mumbai, Maharashtra',
        lat: 19.0144, lng: 72.9200, color: '#3b82f6', sector: 'Nuclear Energy & FinTech',
        desc: 'Bhabha Atomic Research Centre leads India’s 3-stage nuclear power program, thorium reactors, and medical isotopes alongside IIT Bombay.',
        realWork: 'Indigenous Pressurized Heavy Water Reactors (PHWR), Thorium Fuel Cycle & Quantum Cryptography.',
        level: 0, cost: 450, income: 145, gdp: 0.95
      },
      {
        id: 'dholera', state: 'Gujarat',
        name: 'Dholera Semiconductor Fab & IPR',
        city: 'Dholera / Gandhinagar, Gujarat',
        lat: 22.2484, lng: 72.1951, color: '#ff9933', sector: 'Chip Manufacturing & Fusion',
        desc: 'India’s first commercial semiconductor fabrication hub paired with the Institute for Plasma Research (IPR) working on nuclear fusion.',
        realWork: '28nm–3nm Wafer Fabrication, GIFT City Global Finance & Aditya-U Tokamak Fusion Research.',
        level: 0, cost: 650, income: 210, gdp: 1.35
      },
      {
        id: 'iitd', state: 'Delhi NCR',
        name: 'IIT Delhi, DRDO Bhawan & AIIMS',
        city: 'New Delhi',
        lat: 28.5450, lng: 77.1926, color: '#38ef7d', sector: 'Defense Tech, AI & Biotech',
        desc: 'National nerve center for defense R&D (missiles, radars, electronic warfare), sovereign AI policy, and biomedical breakthroughs.',
        realWork: 'DRDO Directed Energy Weapons, Astra Missiles, and AI-driven Healthcare Diagnostics.',
        level: 1, cost: 220, income: 65, gdp: 0.50
      },
      {
        id: 'iitk', state: 'Uttar Pradesh',
        name: 'IIT Kanpur & UP Defence Corridor',
        city: 'Kanpur / Lucknow, Uttar Pradesh',
        lat: 26.5123, lng: 80.2329, color: '#eab308', sector: 'Cybersecurity, Drones & BrahMos',
        desc: 'Premier hub for national cybersecurity (C3iHub), autonomous swarm drones, flight testing, and BrahMos supersonic cruise missile production.',
        realWork: 'National Blockchain & Cyber Defense Systems, UAV Swarm Tech & BrahMos Next-Gen.',
        level: 0, cost: 380, income: 120, gdp: 0.85
      },
      {
        id: 'iitkgp', state: 'West Bengal',
        name: 'IIT Kharagpur & SINP Kolkata',
        city: 'Kharagpur / Kolkata, West Bengal',
        lat: 22.3149, lng: 87.3105, color: '#ec4899', sector: 'Heavy Engineering & Nuclear Physics',
        desc: 'India’s first IIT and Saha Institute of Nuclear Physics driving advanced metallurgy, railway modernization, and high-energy physics.',
        realWork: 'Precision Agri-Tech, Advanced Steel/Alloys & Dark Matter / Particle Physics Experiments.',
        level: 0, cost: 400, income: 130, gdp: 0.88
      },
      {
        id: 'iitg', state: 'Assam & North-East',
        name: 'IIT Guwahati & NESAC Shillong',
        city: 'Guwahati, Assam',
        lat: 26.1878, lng: 91.6916, color: '#14b8a6', sector: 'Green Tech, Satellite Mapping & Bio-Resources',
        desc: 'North-East’s premier innovation center advancing green hydrogen, river engineering, and satellite disaster-warning systems.',
        realWork: 'Nanotechnology, Brahmaputra Flood AI Forecasting & Bio-polymer Materials.',
        level: 0, cost: 350, income: 110, gdp: 0.78
      },
      {
        id: 'ladakh', state: 'Ladakh',
        name: 'Hanle Observatory & Ladakh Solar-H2 Grid',
        city: 'Leh / Hanle, Ladakh',
        lat: 32.7794, lng: 78.9642, color: '#38ef7d', sector: 'Astrophysics & Mega Clean Energy',
        desc: 'World’s highest optical-infrared and gamma-ray observatories alongside ultra-high-altitude solar & green hydrogen power plants.',
        realWork: 'MACE Gamma-Ray Telescope, Indian Astronomical Observatory & 13 GW Renewable Corridor.',
        level: 0, cost: 500, income: 165, gdp: 1.10
      }
    ];

    const globalBenchmarks = [
      {
        id: 'usa', country: '🇺🇸 USA ($29.2T GDP — Rank #1)',
        inst: 'MIT, Stanford, NASA & DARPA',
        budget: 'Spends $900B+/yr on R&D (3.5% of GDP) + $880B Defense Tech',
        earns: 'Earns trillions from Chip/AI IP (Nvidia, Apple, OpenAI), Aerospace & Dollar Reserve.',
        lesson: 'Invest in IITs, IISc & Semiconductor Fabs so India owns global IP instead of just services!',
        scanned: false, intel: 30
      },
      {
        id: 'china', country: '🇨🇳 CHINA ($19.5T GDP — Rank #2)',
        inst: 'Tsinghua Univ, CAS & Shenzhen Hubs',
        budget: 'Spends $500B+ on R&D, 45,000 km High-Speed Rail & Solar/EV Supply Chains',
        earns: '30% of Global Manufacturing, EVs, Batteries, Solar Panels & Rare Earths.',
        lesson: 'Scale up Dholera Fabs, UP Defence Corridor & Mega-Ports to dominate global exports!',
        scanned: false, intel: 30
      },
      {
        id: 'france', country: '🇫🇷 FRANCE ($3.2T GDP — Clean Energy Leader)',
        inst: 'CEA Nuclear Labs, Airbus & INRIA AI',
        budget: '70% Electricity from Nuclear Energy + Aerospace & Green Hydrogen',
        earns: 'Commercial Aircraft (Airbus), Nuclear Power Exports & Global Luxury Brands.',
        lesson: 'Expand BARC Thorium/Nuclear Reactors & Ladakh Clean Grid for 24/7 cheap industrial power!',
        scanned: false, intel: 25
      },
      {
        id: 'russia', country: '🇷🇺 RUSSIA ($2.1T GDP — Space & Heavy Tech)',
        inst: 'Roscosmos, Rosatom & Kurchatov Institute',
        budget: 'Heavy Rocket Propulsion, Nuclear Reactors & Arctic Metallurgy',
        earns: 'Nuclear Reactor Exports (70% global share), Natural Gas, Titanium & Defense.',
        lesson: 'Strengthen ISRO Heavy Launchers & DRDO indigenous metallurgy for total strategic autonomy!',
        scanned: false, intel: 25
      }
    ];

    const state = {
      funds: 400,
      gdp: 4.30,
      intel: 0,
      selectedInst: institutions[0],
      viewMode: 'institute' // 'institute' or 'global'
    };

    // Initialize Real Leaflet Map centered on India
    const map = L.map('map', {
      center: [22.5, 80.5],
      zoom: 5,
      minZoom: 4,
      maxZoom: 12
    });

    // Carto Voyager / OSM Layer styled into Dark Tactical Map via CSS filter
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
      subdomains: 'abcd',
      maxZoom: 19
    }).addTo(map);

    // Add Real Indian State Boundaries via GeoJSON (Public Data)
    fetch('https://raw.githubusercontent.com/geohacker/india/master/state/india_state.geojson')
      .then(res => res.json())
      .then(data => {
        L.geoJSON(data, {
          style: {
            color: '#ff9933',
            weight: 1.5,
            opacity: 0.75,
            fillColor: '#00e5ff',
            fillOpacity: 0.05
          },
          onEachFeature: (feature, layer) => {
            const stName = feature.properties.NAME_1 || feature.properties.st_nm || 'India State';
            layer.bindTooltip(stName, { sticky: true, direction: 'top' });
            layer.on('mouseover', () => layer.setStyle({ fillOpacity: 0.18, color: '#00e5ff', weight: 2.2 }));
            layer.on('mouseout', () => layer.setStyle({ fillOpacity: 0.05, color: '#ff9933', weight: 1.5 }));
            layer.on('click', (e) => {
              map.fitBounds(layer.getBounds(), { padding: [40, 40], maxZoom: 7 });
            });
          }
        }).addTo(map);
      })
      .catch(() => console.log('Boundary overlay loaded in base mode'));

    // Place Real Institute Pins on Map
    institutions.forEach(inst => {
      const icon = L.divIcon({
        className: '',
        html: `<div class="inst-pin" style="background:${inst.color}; color:${inst.color};" title="${inst.name}">🏛️</div>`,
        iconSize: [24, 24],
        iconAnchor: [12, 12]
      });

      const marker = L.marker([inst.lat, inst.lng], { icon }).addTo(map);
      marker.bindTooltip(`<b>${inst.name}</b><br>${inst.state}`, { direction: 'top' });
      marker.on('click', () => {
        state.selectedInst = inst;
        state.viewMode = 'institute';
        map.flyTo([inst.lat, inst.lng], 7, { duration: 0.9 });
        renderDrawer();
      });
    });

    // Top State & Global Navigation Pills
    function renderStateBar() {
      const bar = document.getElementById('stateBar');
      bar.innerHTML = `<span class="nav-label">📍 STATES & HUBS:</span>`;

      const resetBtn = document.createElement('button');
      resetBtn.className = 'pill';
      resetBtn.textContent = '🇮🇳 Full India Map';
      resetBtn.onclick = () => map.flyTo([22.5, 80.5], 5, { duration: 0.8 });
      bar.appendChild(resetBtn);

      institutions.forEach(inst => {
        const btn = document.createElement('button');
        btn.className = 'pill';
        btn.textContent = inst.state;
        btn.onclick = () => {
          state.selectedInst = inst;
          state.viewMode = 'institute';
          map.flyTo([inst.lat, inst.lng], 7, { duration: 0.9 });
          renderDrawer();
        };
        bar.appendChild(btn);
      });

      const globalBtn = document.createElement('button');
      globalBtn.className = 'pill global';
      globalBtn.textContent = '🌍 Compare USA / China / France / Russia';
      globalBtn.onclick = () => {
        state.viewMode = 'global';
        renderDrawer();
      };
      bar.appendChild(globalBtn);
    }

    function upgradeInstitute(id) {
      const inst = institutions.find(i => i.id === id);
      const discount = Math.min(0.4, state.intel * 0.002);
      const finalCost = Math.round(inst.cost * (1 - discount));

      if (state.funds >= finalCost) {
        state.funds -= finalCost;
        inst.level++;
        const boost = 1 + (state.intel * 0.006);
        state.gdp += inst.gdp * boost;
        inst.cost = Math.round(inst.cost * 1.48);
        renderDrawer();
        updateHUD();
      }
    }

    function scanGlobal(id) {
      const g = globalBenchmarks.find(x => x.id === id);
      if (!g.scanned) {
        g.scanned = true;
        state.intel += g.intel;
        state.funds += g.intel * 15;
        renderDrawer();
        updateHUD();
      }
    }

    function renderDrawer() {
      const drawer = document.getElementById('drawer');

      if (state.viewMode === 'global') {
        drawer.innerHTML = `
          <div class="drawer-badge" style="background:rgba(0,229,255,0.15); color:#00e5ff;">GLOBAL GEOPOLITICS & R&D BENCHMARK</div>
          <h2>Learn from Global Superpowers</h2>
          <p style="margin-top:6px;">Analyze how USA, China, France & Russia spend their budget and generate trillions—then apply those lessons in Indian Institutes!</p>
          ${globalBenchmarks.map(g => `
            <div class="global-card">
              <h4>${g.country}</h4>
              <p><b>Key Institutions:</b> ${g.inst}</p>
              <p><b>Budget Spend:</b> ${g.budget}</p>
              <p><b>Revenue:</b> ${g.earns}</p>
              <p style="color:#38ef7d;"><b>🇮🇳 Lesson:</b> ${g.lesson}</p>
              <button class="scan-btn" onclick="scanGlobal('${g.id}')" ${g.scanned ? 'disabled' : ''}>
                ${g.scanned ? '✅ Intel Applied (+' + g.intel + ' 🧠)' : '🔍 Extract R&D Intel (+' + g.intel + ' 🧠 & +₹' + (g.intel*15) + ' Cr)'}
              </button>
            </div>
          `).join('')}
          <button class="mine-btn" onclick="state.viewMode='institute'; renderDrawer();">⬅️ Back to Indian Institute Inspector</button>
        `;
        return;
      }

      const inst = state.selectedInst;
      const discount = Math.min(0.4, state.intel * 0.002);
      const finalCost = Math.round(inst.cost * (1 - discount));

      drawer.innerHTML = `
        <div class="drawer-badge" style="background:${inst.color}25; color:${inst.color};">${inst.sector}</div>
        <h2>${inst.name}</h2>
        <div class="loc">📍 ${inst.city} • Level ${inst.level}</div>
        <p>${inst.desc}</p>
        <div class="fact-box">
          <b>🔬 Real Flagship Research & Projects:</b>
          ${inst.realWork}
        </div>
        <div class="stats-row">
          <div class="mini-stat"><span>R&D Output</span><b>+₹${inst.income * Math.max(1, inst.level)} Cr/s</b></div>
          <div class="mini-stat"><span>GDP Impact</span><b>+$${inst.gdp} Trillion</b></div>
        </div>
        <button class="action-btn" onclick="upgradeInstitute('${inst.id}')" ${state.funds < finalCost ? 'disabled' : ''}>
          🚀 Fund & Expand Institute (₹${finalCost} Cr)
        </button>
        <button class="mine-btn" onclick="state.funds += (30 + state.intel*2); updateHUD();">
          ⚡ Conduct R&D Grant (+₹${30 + state.intel*2} Cr)
        </button>
      `;
    }

    function updateHUD() {
      document.getElementById('funds').textContent = '₹' + Math.floor(state.funds).toLocaleString('en-IN') + ' Cr';
      document.getElementById('gdp').textContent = '$' + state.gdp.toFixed(2) + ' T';
      document.getElementById('intel').textContent = state.intel + ' 🧠';

      let rank = '#4 (Next: Germany $4.7T)';
      if (state.gdp >= 29.2) rank = '#1 GLOBAL SUPERPOWER 🏆 (Beat USA!)';
      else if (state.gdp >= 19.5) rank = '#2 (Beat China! Target USA $29.2T)';
      else if (state.gdp >= 4.7) rank = '#3 (Target China $19.5T)';
      document.getElementById('rank').textContent = rank;
    }

    setInterval(() => {
      let totalIncome = 0;
      institutions.forEach(i => totalIncome += i.level * i.income);
      const boost = 1 + (state.intel * 0.005);
      state.funds += (totalIncome * boost) / 10;
      state.gdp += (totalIncome * boost) / 450000;
      updateHUD();
      renderDrawer();
    }, 1000);

    renderStateBar();
    renderDrawer();
    updateHUD();
  </script>
</body>
</html>
