<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>BHARAT 2047: State-by-State Superpower Strategy</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; user-select: none; }
    body { background: #040812; color: #eef4ff; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }

    .hud {
      display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap;
      padding: 8px 16px; background: rgba(10, 18, 36, 0.96); border-bottom: 1px solid #1e3a6e;
      z-index: 10; gap: 8px;
    }
    .brand { font-weight: 800; font-size: 1.05rem; background: linear-gradient(90deg, #ff9933, #fff, #38ef7d); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .metrics { display: flex; gap: 16px; flex-wrap: wrap; }
    .metric { font-size: 0.75rem; color: #8ca0c4; }
    .metric b { display: block; font-size: 0.96rem; color: #00e5ff; }
    .metric.gdp b { color: #38ef7d; }
    .metric.rank b { color: #ffd700; }

    .world-bar {
      display: flex; justify-content: center; gap: 8px; padding: 7px;
      background: #071022; border-bottom: 1px solid #172d56; z-index: 10; flex-wrap: wrap;
    }
    .country-btn {
      padding: 5px 14px; border-radius: 99px; border: 1px solid #264885;
      background: #0d1b38; color: #cbd5e1; font-size: 0.8rem; font-weight: 700; cursor: pointer; transition: 0.2s;
    }
    .country-btn.active { background: #ff9933; color: #050b16; border-color: #ff9933; box-shadow: 0 0 12px rgba(255,153,51,0.5); }
    .country-btn.foreign.active { background: #00e5ff; color: #050b16; border-color: #00e5ff; box-shadow: 0 0 12px rgba(0,229,255,0.5); }

    .stage { position: relative; flex: 1; width: 100%; overflow: hidden; }
    canvas { display: block; width: 100%; height: 100%; }

    .intel-panel {
      position: absolute; top: 52px; right: 14px; width: 300px; max-width: 90vw;
      background: rgba(9, 17, 34, 0.94); border: 1px solid #00e5ff; border-radius: 14px;
      padding: 13px; box-shadow: 0 10px 30px rgba(0,0,0,0.85); z-index: 12; display: none;
    }
    .intel-panel h3 { font-size: 0.95rem; color: #00e5ff; margin-bottom: 6px; }
    .intel-section { margin-top: 7px; font-size: 0.78rem; line-height: 1.4; }
    .intel-section b { color: #ff9933; display: block; margin-bottom: 2px; }
    .intel-lesson {
      margin-top: 9px; padding: 7px; background: rgba(56, 239, 125, 0.1);
      border-left: 3px solid #38ef7d; font-size: 0.76rem; color: #d1fae5;
    }

    .prompt {
      position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
      background: rgba(255, 153, 51, 0.16); border: 1px solid #ff9933; color: #ffcf9e;
      padding: 6px 14px; border-radius: 99px; font-size: 0.79rem; font-weight: 600;
      pointer-events: none; text-align: center; white-space: nowrap; max-width: 94vw; overflow: hidden; text-overflow: ellipsis;
    }
    .alert-banner {
      position: absolute; top: 44px; left: 50%; transform: translateX(-50%);
      background: rgba(239, 68, 68, 0.92); color: #fff; padding: 5px 15px;
      border-radius: 10px; font-weight: 700; font-size: 0.8rem; display: none;
    }

    .dock {
      position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 8px; background: rgba(8, 15, 30, 0.92);
      padding: 8px 10px; border-radius: 14px; border: 1px solid #264885;
      z-index: 10; max-width: 97vw; overflow-x: auto;
    }
    .hub-card {
      background: #0e1b36; border: 1px solid #1f3b70; border-radius: 10px;
      padding: 6px 10px; min-width: 142px; cursor: pointer; transition: 0.15s;
    }
    .hub-card:hover { border-color: #ff9933; }
    .hub-card h4 { font-size: 0.78rem; color: #fff; }
    .hub-card p { font-size: 0.68rem; color: #8ca0c4; margin: 2px 0; }
    .hub-card span { font-size: 0.72rem; font-weight: 700; color: #38ef7d; }
  </style>
</head>

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playTone(freq, type, duration, vol = 0.06) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
      osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(vol, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + duration);
    }

      },

        earns: '30% of Global Manufacturing, EVs (BYD), Solar Panels, Batteries, Electronics & Rare Earths.',
        spends: '45,000 km High-Speed Rail, Mega-Ports, Green Energy Subsidies, State Semiconductor Funds.',
        lesson: 'India Lesson: World-class ports, bullet freight & massive scale factories turn a nation into an export giant!',
        outline: [[0.23,0.34],[0.42,0.27],[0.58,0.21],[0.75,0.17],[0.79,0.32],[0.73,0.49],[0.68,0.66],[0.52,0.73],[0.35,0.62],[0.22,0.50]],
        states: [
          { name: 'XINJIANG SOLAR BELT', poly: [[0.23,0.34],[0.43,0.28],[0.42,0.48],[0.23,0.48]], cx: 0.33, cy: 0.39, fill: 'rgba(250,204,21,0.12)' },
          { name: 'BEIJING-SHANGHAI', poly: [[0.56,0.22],[0.76,0.22],[0.74,0.47],[0.56,0.47]], cx: 0.66, cy: 0.34, fill: 'rgba(239,68,68,0.14)' },

          { id: 'sz', name: 'Guangdong: Shenzhen Hub', rx: 0.61, ry: 0.60, scanned: false, intelGain: 25, budget: '$320B/yr', detail: 'Fastest hardware, EV & drone manufacturing ecosystem.' },

        ]
      },
      russia: {

        earns: 'Oil, Natural Gas, Nuclear Reactors (Rosatom), Titanium, Fertilizers & Heavy Defense Tech.',
        spends: 'Nuclear Icebreakers, Arctic Routes, Heavy Rocket Engines & Metallurgy.',

        states: [

        ],

        spends: '70% Nuclear Clean Grid (EDF), TGV High-Speed Rail, Green Hydrogen & Mistral AI.',
        lesson: 'India Lesson: 24/7 clean nuclear power + global consumer/luxury brands drive high per-capita wealth!',
        outline: [[0.44,0.20],[0.56,0.24],[0.64,0.38],[0.60,0.58],[0.52,0.72],[0.38,0.68],[0.34,0.50],[0.32,0.34]],

        ],

      }
    };

    const state = {
      currentWorld: 'india',
      funds: 350,
      gdp: 4.30,
      intel: 0,
      shake: 0,
      rover: { x: 0.48, y: 0.45, tx: 0.48, ty: 0.45 },
      particles: [],
      rockets: [],
      keys: {}
    };

    function spawnParticles(x, y, color, text = '') {
      for (let i = 0; i < 14; i++) {
        const a = Math.random() * Math.PI * 2, s = 1 + Math.random() * 3.5;
        state.particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 1, color, text: i === 0 ? text : '' });
      }
    }

    function switchWorld(key) {
      state.currentWorld = key;
      state.rover.x = state.rover.tx = 0.48;
      state.rover.y = state.rover.ty = 0.46;
      playTone(480, 'sine', 0.14, 0.05);
      renderWorldBar();
      renderIntelPanel();
      renderDock();
    }

    function renderWorldBar() {
      const bar = document.getElementById('worldBar');
      bar.innerHTML = '';
      Object.keys(worlds).forEach(k => {
        const w = worlds[k];
        const btn = document.createElement('button');
        btn.className = `country-btn ${w.isHome ? '' : 'foreign'} ${state.currentWorld === k ? 'active' : ''}`;
        btn.textContent = w.name;
        btn.onclick = () => switchWorld(k);
        bar.appendChild(btn);
      });
    }

    function renderIntelPanel() {
      const panel = document.getElementById('intelPanel');
      const w = worlds[state.currentWorld];
      if (w.isHome) { panel.style.display = 'none'; return; }
      panel.style.display = 'block';
      panel.innerHTML = `
        <h3>📊 ${w.name} — Budget & Revenue</h3>
        <div class="intel-section"><b>💰 Kahan Se Kamate Hain:</b>${w.earns}</div>
        <div class="intel-section"><b>🏗️ Kahan Kharch Karte Hain:</b>${w.spends}</div>
        <div class="intel-lesson"><b>🇮🇳 Bharat Action Plan:</b> ${w.lesson}</div>
      `;
    }

    function interact() {
      const w = worlds[state.currentWorld];
      let nearest = null, minD = 999;
      w.hubs.forEach(h => {
        const d = Math.hypot((h.rx - state.rover.x) * W, (h.ry - state.rover.y) * H);
        if (d < minD) { minD = d; nearest = h; }
      });

      if (!nearest || minD > 75) {
        const gain = 20 + state.intel * 2;
        state.funds += gain;
        spawnParticles(state.rover.x * W, state.rover.y * H, '#00e5ff', `+₹${gain} Cr`);
        playTone(520, 'sine', 0.1, 0.04);
        return;
      }

      if (!w.isHome) {
        if (!nearest.scanned) {
          nearest.scanned = true;
          state.intel += nearest.intelGain;
          const bonusFunds = nearest.intelGain * 15;
          state.funds += bonusFunds;
          spawnParticles(nearest.rx * W, nearest.ry * H, '#38ef7d', `INTEL +${nearest.intelGain} 🧠 | +₹${bonusFunds} Cr`);
          playTone(760, 'triangle', 0.3, 0.08);
          renderDock();
        } else {
          spawnParticles(nearest.rx * W, nearest.ry * H, '#00e5ff', 'Already Scanned! Apply in Bharat 🇮🇳');
        }
        return;
      }

      if (nearest.threat) {
        nearest.threat = false;
        const reward = Math.round(nearest.cost * 0.6);
        state.funds += reward; state.gdp += 0.35;
        spawnParticles(nearest.rx * W, nearest.ry * H, '#38ef7d', `DEFENDED ${nearest.state.toUpperCase()}! +₹${reward} Cr`);
        playTone(800, 'triangle', 0.3, 0.09);
        document.getElementById('alertBanner').style.display = 'none';
        return;
      }

      const discount = Math.min(0.4, state.intel * 0.002);
      const finalCost = Math.round(nearest.cost * (1 - discount));

      if (state.funds >= finalCost) {
        state.funds -= finalCost;
        nearest.level++;
        const intelMultiplier = 1 + (state.intel * 0.005);
        state.gdp += nearest.gdp * intelMultiplier;
        nearest.cost = Math.round(nearest.cost * 1.48);
        spawnParticles(nearest.rx * W, nearest.ry * H, nearest.color, `${nearest.state}: LVL ${nearest.level}!`);
        playTone(440, 'square', 0.25, 0.07);
        state.shake = 5;
        if (nearest.id === 'tamilnadu') state.rockets.push({ x: nearest.rx * W, y: nearest.ry * H, vy: -1.6 });
        renderDock();
      } else {
        playTone(160, 'sawtooth', 0.15, 0.05);
        spawnParticles(nearest.rx * W, nearest.ry * H, '#ef4444', `Need ₹${finalCost} Cr!`);
      }
    }

    function renderDock() {
      const dock = document.getElementById('dock');
      dock.innerHTML = '';
      const w = worlds[state.currentWorld];
      const discount = Math.min(0.4, state.intel * 0.002);

      w.hubs.forEach(h => {
        const card = document.createElement('div');
        card.className = 'hub-card';
        if (w.isHome) {
          const finalCost = Math.round(h.cost * (1 - discount));
          card.innerHTML = `
            <h4>${h.state}: Lv.${h.level}</h4>
            <p>${h.name}</p>
            <span>₹${finalCost} Cr (+$${h.gdp}T)</span>
          `;
        } else {
          card.innerHTML = `
            <h4>${h.name} ${h.scanned ? '✅' : '🔍'}</h4>
            <p>${h.budget}</p>
            <span>${h.scanned ? 'Scanned!' : 'Scan +' + h.intelGain + ' Intel 🧠'}</span>
          `;
        }
        card.onclick = () => {
          state.rover.tx = h.rx; state.rover.ty = h.ry;
          setTimeout(interact, 320);
        };
        dock.appendChild(card);
      });
    }

    window.addEventListener('keydown', e => {
      state.keys[e.code] = true;
      if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); interact(); }
    });
    window.addEventListener('keyup', e => state.keys[e.code] = false);
    canvas.addEventListener('click', e => {
      const rect = canvas.getBoundingClientRect();
      state.rover.tx = (e.clientX - rect.left) / W;
      state.rover.ty = (e.clientY - rect.top) / H;
    });

    setInterval(() => {
      const indiaHubs = worlds.india.hubs.filter(h => h.level > 0 && !h.threat);
      if (indiaHubs.length > 0 && Math.random() > 0.45) {
        indiaHubs[Math.floor(Math.random() * indiaHubs.length)].threat = true;
        document.getElementById('alertBanner').style.display = 'block';
        playTone(210, 'sawtooth', 0.35, 0.07);
      }
    }, 26000);

    setInterval(() => {
      let totalGps = 0;
      worlds.india.hubs.forEach(h => { if (!h.threat) totalGps += h.level * h.income; });
      const intelBoost = 1 + (state.intel * 0.005);
      state.funds += (totalGps * intelBoost) / 10;
      state.gdp += (totalGps * intelBoost) / 450000; // Realistic progression pace

      document.getElementById('funds').textContent = '₹' + Math.floor(state.funds).toLocaleString('en-IN') + ' Cr';
      document.getElementById('gdp').textContent = '$' + state.gdp.toFixed(2) + ' T';
      document.getElementById('intel').textContent = state.intel + ' 🧠';

      let rankText = '#4 (Next: Germany $4.7T)';
      if (state.gdp >= 29.2) rankText = '#1 GLOBAL SUPERPOWER 🏆 (Beat USA!)';
      else if (state.gdp >= 19.5) rankText = '#2 (Beat China! Target USA $29.2T)';
      else if (state.gdp >= 4.7) rankText = '#3 (Target China $19.5T)';
      document.getElementById('rank').textContent = rankText;
    }, 100);

    function draw() {
      ctx.save();
      if (state.shake > 0) {
        ctx.translate((Math.random() - 0.5) * state.shake, (Math.random() - 0.5) * state.shake);
        state.shake *= 0.85;
      }

      ctx.fillStyle = '#040812'; ctx.fillRect(0, 0, W, H);
      ctx.strokeStyle = 'rgba(30, 58, 110, 0.2)';
      for (let x = 0; x < W; x += 45) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
      for (let y = 0; y < H; y += 45) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }

      const w = worlds[state.currentWorld];

      // 1. Draw Internal States / Provinces First
      if (w.states) {
        w.states.forEach(st => {
          ctx.beginPath();
          st.poly.forEach((pt, i) => {
            const px = pt[0] * W, py = pt[1] * H;
            i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
          });
          ctx.closePath();
          ctx.fillStyle = st.fill;
          ctx.fill();
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.22)';
          ctx.lineWidth = 1;
          ctx.setLineDash([4, 4]);
          ctx.stroke();
          ctx.setLineDash([]);

          // State Name Watermark
          ctx.fillStyle = 'rgba(226, 232, 240, 0.38)';
          ctx.font = 'bold 10px Segoe UI';
          ctx.textAlign = 'center';
          ctx.fillText(st.name, st.cx * W, st.cy * H);
        });
      }

      // 2. Draw Outer Country Border
      ctx.beginPath();
      w.outline.forEach((pt, i) => {
        const px = pt[0] * W, py = pt[1] * H;
        i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
      });
      ctx.closePath();
      ctx.strokeStyle = w.color;
      ctx.lineWidth = 2.5;
      ctx.shadowColor = w.color; ctx.shadowBlur = 12;
      ctx.stroke(); ctx.shadowBlur = 0;

      // 3. Draw Hubs
      let nearHub = null;
      w.hubs.forEach(h => {
        const hx = h.rx * W, hy = h.ry * H;
        if (Math.hypot(hx - state.rover.x * W, hy - state.rover.y * H) < 75) nearHub = h;

        ctx.beginPath();
        ctx.arc(hx, hy, 14 + Math.sin(Date.now() / 220) * 3, 0, Math.PI * 2);
        ctx.fillStyle = h.threat ? 'rgba(239,68,68,0.35)' : (w.isHome ? h.color + '33' : 'rgba(0,229,255,0.25)');
        ctx.fill();

        ctx.beginPath();
        ctx.arc(hx, hy, 8, 0, Math.PI * 2);
        ctx.fillStyle = h.threat ? '#ef4444' : (w.isHome ? (h.level > 0 ? h.color : '#475569') : (h.scanned ? '#38ef7d' : '#00e5ff'));
        ctx.fill();

        ctx.fillStyle = '#fff'; ctx.font = 'bold 11px Segoe UI'; ctx.textAlign = 'center';
        const tag = w.isHome ? `${h.name} (Lv.${h.level})` : `${h.name} [${h.budget}]`;
        ctx.fillText(tag, hx, hy - 16);
      });

      const promptEl = document.getElementById('promptText');
      if (nearHub) {
        if (w.isHome) {
          promptEl.textContent = nearHub.threat
            ? `🚨 PRESS SPACE TO DEFEND ${nearHub.state.toUpperCase()}!`
            : `[SPACE] ${nearHub.state}: Build ${nearHub.name} — ${nearHub.note}`;
        } else {
          promptEl.textContent = nearHub.scanned
            ? `✅ Strategy Learned! Switch to 🇮🇳 BHARAT to invest with Intel Bonus!`
            : `[SPACE] Scan ${nearHub.name} (+${nearHub.intelGain} Intel 🧠)`;
        }
      } else {
        promptEl.textContent = w.isHome
          ? 'Fly Rover across Indian States to Build • Check USA/China/Russia/France to Scan Strategies!'
          : `Exploring ${w.name} States • Fly Rover to Nodes & Press SPACE to Extract Budget Intel!`;
      }

      const speed = 0.0055;
      if (state.keys['KeyW'] || state.keys['ArrowUp']) { state.rover.y -= speed; state.rover.ty = state.rover.y; }
      if (state.keys['KeyS'] || state.keys['ArrowDown']) { state.rover.y += speed; state.rover.ty = state.rover.y; }
      if (state.keys['KeyA'] || state.keys['ArrowLeft']) { state.rover.x -= speed; state.rover.tx = state.rover.x; }
      if (state.keys['KeyD'] || state.keys['ArrowRight']) { state.rover.x += speed; state.rover.tx = state.rover.x; }
      state.rover.x += (state.rover.tx - state.rover.x) * 0.08;
      state.rover.y += (state.rover.ty - state.rover.y) * 0.08;

      const rx = state.rover.x * W, ry = state.rover.y * H;
      ctx.fillStyle = '#ff9933'; ctx.beginPath(); ctx.arc(rx, ry, 9, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();

      state.rockets.forEach((r, idx) => {
        r.y += r.vy; r.vy *= 1.04;
        ctx.fillStyle = '#fff'; ctx.fillRect(r.x - 3, r.y - 12, 6, 16);
        if (r.y < -30) state.rockets.splice(idx, 1);
      });
      state.particles.forEach((p, idx) => {
        p.x += p.vx; p.y += p.vy; p.life -= 0.024;
        ctx.globalAlpha = Math.max(0, p.life); ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, 4, 4);
        if (p.text) { ctx.font = 'bold 12px Segoe UI'; ctx.fillText(p.text, p.x, p.y - 8); }
        ctx.globalAlpha = 1;
        if (p.life <= 0) state.particles.splice(idx, 1);
      });

      ctx.restore();
      requestAnimationFrame(draw);
    }

    renderWorldBar();
    renderDock();
    draw();
  </script>
</body>
</html>
